<!DOCTYPE html>
<html>

<head>

<title>PhishShield AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container hero">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="scan-card">

<h1 class="text-center mb-3">

<i class="bi bi-shield-lock-fill text-danger"></i>

PhishShield AI

</h1>


<p class="text-secondary text-center">
Detect phishing websites using AI-powered URL analysis and security heuristics.
</p>

<form action="/scan" method="POST">

<div class="input-group input-group-lg mt-4">

    <span class="input-group-text">
        <i class="bi bi-link-45deg"></i>
    </span>

    <input
    type="text"
    class="form-control"
    name="url"
    placeholder="https://example.com"
    required>

</div>

<div class="text-center">

<button class="btn btn-danger btn-lg mt-4">

<i class="bi bi-search"></i>

Analyze Website

</button>

</div>

</form>

</div>

</div>

</div>

<div class="row mt-5">

<div class="col-md-4">

<div class="feature-box">

<h2><i class="bi bi-cpu"></i></h2>

<h5>AI Analysis</h5>

</div>

</div>

<div class="col-md-4">

<div class="feature-box">

<h2><i class="bi bi-link-45deg"></i></h2>

<h5>URL Inspection</h5>

</div>

</div>

<div class="col-md-4">

<div class="feature-box">

<h2><i class="bi bi-shield-check"></i></h2>

<h5>Security Report</h5>

</div>

</div>

</div>

</div>
<footer class="text-center text-secondary mt-5 mb-3">
    Built using Flask • Python • Bootstrap • AI Security
</footer>

</body>

</html>
